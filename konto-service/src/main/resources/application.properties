spring.application.name=BankingApp
server.port=8081

benachrichtigung.service.url=${BENACHRICHTIGUNG_SERVICE_URL:http://benachrichtigung-service:8082}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.datasource.driver-class-name=org.h2.Driver

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.endpoints.web.cors.allowed-methods=GET

# Demo-Benutzer für die Authentifizierung
demo.auth.username=${DEMO_USER:demo}
demo.auth.password=${DEMO_PASSWORD}

logging.level.com.demo=INFO # Nur eigenen Code auf INFO