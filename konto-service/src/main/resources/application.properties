spring.application.name=BankingApp
server.port=8081
benachrichtigung.service.url=${BENACHRICHTIGUNG_SERVICE_URL:http://benachrichtigung-service:8082}
spring.datasource.driver-class-name=org.h2.Driver
management.endpoints.web.exposure.include=health,info, metrics,httptrace
management.endpoint.health.show-details=always
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.endpoints.web.cors.allowed-methods=GET
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Nur eigenen Code auf INFO
logging.level.com.demo=INFO

spring.profiles.active=dev