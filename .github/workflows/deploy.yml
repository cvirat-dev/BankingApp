name: Build and Deploy to Azure
on:
  push:
    branches: [ main ]
env:
  ACR_NAME: bankingappregistry
  RESOURCE_GROUP: banking-app-rg
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Login to ACR
        run: az acr login --name $ACR_NAME
      - name: Build & Push konto-service
        run: |
          cd konto-service && ./mvnw clean package -DskipTests
          docker build -t $ACR_NAME.azurecr.io/konto-service:latest .
          docker push $ACR_NAME.azurecr.io/konto-service:latest
      - name: Build & Push benachrichtigung-service
        run: |
          cd benachrichtigung-service && ./mvnw clean package -DskipTests
          docker build -t $ACR_NAME.azurecr.io/benachrichtigung-service:latest .
          docker push $ACR_NAME.azurecr.io/benachrichtigung-service:latest
      - name: Update Container Apps
        run: |
          az containerapp update --name konto-service \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/konto-service:latest
          az containerapp update --name benachrichtigung-service \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/benachrichtigung-service:latest