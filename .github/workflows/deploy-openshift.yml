name: Build and Deploy to OpenShift

on:
    push:
        branches: [ main ]

env:
  CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS_OPENSHIFT }}

jobs:
    build-and-deploy-openshift:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Install oc CLI
              run: |
                curl -fsSL https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/stable-4.15/openshift-client-linux.tar.gz \
                  | sudo tar -xz -C /usr/local/bin oc
                oc version --client

            - name: Login to OpenShift
              run: |
                oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }}

            - name: Build & push images (via oc)
              run: |
                cd konto-service && ./mvnw clean package -DskipTests && cd ..
                oc start-build konto-service --from-dir=./konto-service --follow

                cd benachrichtigung-service && ./mvnw clean package -DskipTests && cd ..
                oc start-build benachrichtigung-service --from-dir=./benachrichtigung-service --follow
                
                oc start-build banking-frontend --from-dir=./banking-frontend --follow
            
            - name: Apply manifests
              run: oc apply -R -f k8s/

            - name: Set env & trigger rollout (backend)
              run: |
                oc set env deployment/konto-service CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" DEPLOY_REVISION="${{ github.sha }}"
                oc set env deployment/benachrichtigung-service CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" DEPLOY_REVISION="${{ github.sha }}"

            - name: Trigger rollout (frontend)
              run: oc rollout restart deployment/banking-frontend