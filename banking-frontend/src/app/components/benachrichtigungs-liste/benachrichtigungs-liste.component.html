<div *ngIf="benachrichtigungen.length > 0; else leerZustand" class="benachrichtigungs-liste">
  <app-benachrichtigung-item
    *ngFor="let benachrichtigung of benachrichtigungen"
    [benachrichtigung]="benachrichtigung">
  </app-benachrichtigung-item>
</div>

<ng-template #leerZustand>
  <div class="leer-zustand">
    <span class="leer-zustand__icon">🔔</span>
    <p>Keine {{ typLabel }}-Benachrichtigungen vorhanden.</p>
  </div>
</ng-template>
