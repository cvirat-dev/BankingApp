<div class="page-header">
  <h2>Benachrichtigungen</h2>
  <p>Aktivitätsprotokoll aller Kontobewegungen</p>
</div>

<div class="benachrichtigungs-log-container">
  <app-benachrichtigungs-tabs
    [tabs]="tabs"
    [aktiv]="aktuellerTyp"
    (typChanged)="onBenachrichtigungTypChanged($event)">
  </app-benachrichtigungs-tabs>

  <app-konto-benachrichtigungen *ngIf="aktuellerTyp === 'KONTO'"></app-konto-benachrichtigungen>
  <app-buchung-benachrichtigungen *ngIf="aktuellerTyp === 'BUCHUNG'"></app-buchung-benachrichtigungen>
  <app-transaktion-benachrichtigungen *ngIf="aktuellerTyp === 'TRANSAKTION'"></app-transaktion-benachrichtigungen>
</div>
