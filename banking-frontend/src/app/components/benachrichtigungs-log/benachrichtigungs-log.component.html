<div class="page-header">
  <h2>Benachrichtigungen</h2>
  <p>Aktivitätsprotokoll aller Kontobewegungen</p>
</div>

<div *ngIf="ladevorgang" class="loading-state">
  <div class="spinner"></div>
  <p>Benachrichtigungen werden geladen…</p>
</div>

<ng-container *ngIf="!ladevorgang">
  <app-benachrichtigungs-tabs
    [tabs]="tabs"
    [aktiv]="aktuellerTyp"
    (typGewaehlt)="onTypGewaehlt($event)">
  </app-benachrichtigungs-tabs>

  <app-benachrichtigungs-liste
    [benachrichtigungen]="gefilterteBenachrichtigungen"
    [typLabel]="aktuellerTypLabel">
  </app-benachrichtigungs-liste>
</ng-container>
