<div class="app-container">

  <nav class="navbar">
    <a class="brand" routerLink="/konten">Banking App</a>
    <div class="nav-links">
      <a routerLink="/konten" [class.active]="currentSection === 'konten'">Konten</a>
      <a routerLink="/buchung" [class.active]="currentSection === 'buchung'">Buchungen</a>
      <a routerLink="/transaktion" [class.active]="currentSection === 'transaktion'">Transaktionen</a>
      <a routerLink="/benachrichtigungen" [class.active]="currentSection === 'benachrichtigungen'" (click)="onBenachrichtigungenClick()">

        Benachrichtigungen

        <span class="badge" *ngIf="unreadCount > 0">
          {{ unreadCount > 99 ? '99+' : unreadCount }}
        </span>
      </a>
    </div>
  </nav>

  <main class="main-content">
    <aside class="side-nav">
      <a *ngFor="let item of sideNavItems" [routerLink]="item.link" routerLinkActive="active">
        {{ item.label }}
      </a>
    </aside>
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>

  <nav class="footer">
    <app-connection-status></app-connection-status>
  </nav>

</div>
