<div class="app-container">

  <nav class="navbar">
    <a class="brand" routerLink="/konten">Banking App</a>
    <div class="nav-links">
      <a routerLink="/konten"             routerLinkActive="active">Konten</a>
      <a routerLink="/konto-erstellen"    routerLinkActive="active">Neues Konto</a>
      <a routerLink="/buchung"            routerLinkActive="active">Buchung</a>
      <a routerLink="/benachrichtigungen" routerLinkActive="active">
        Benachrichtigungen
        <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
      </a>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <nav class="footer">
    <app-connection-status></app-connection-status>
  </nav>

</div>
