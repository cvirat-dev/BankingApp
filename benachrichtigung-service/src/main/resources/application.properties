spring.application.name=benachrichtigung-service
server.port=8082

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.datasource.driver-class-name=org.h2.Driver

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.endpoints.web.cors.allowed-methods=GET

demo.auth.username=${DEMO_USER:demo}
demo.auth.password=${DEMO_PASSWORD}

logging.level.com.demo=INFO
