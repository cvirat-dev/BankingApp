apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: banking-frontend }
  template:
    metadata:
      labels: { app: banking-frontend }
    spec:
      containers:
        - name: banking-frontend
          image: image-registry.openshift-image-registry.svc:5000/cvirat-dev-dev/banking-frontend:latest
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: banking-frontend
spec:
  selector: { app: banking-frontend }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: banking-frontend
spec:
  to: { kind: Service, name: banking-frontend }
  port: { targetPort: 8080 }
  tls: { termination: edge }