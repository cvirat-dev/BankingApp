apiVersion: apps/v1
kind: Deployment
metadata:
  name: benachrichtigung-service
  labels:
    app: benachrichtigung-service
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: benachrichtigung-service
  template:
    metadata:
      labels:
        app: benachrichtigung-service
    spec:
      containers:
        - name: benachrichtigung-service
          image: image-registry.openshift-image-registry.svc:5000/cvirat-dev-dev/benachrichtigung-service:latest
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          ports:
            - containerPort: 8082
          volumeMounts:
            - name: h2-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 15
          resources:
            requests: { cpu: '100m', memory: '256Mi' }
            limits:   { cpu: '500m', memory: '512Mi' }
      volumes:
        - name: h2-data
          persistentVolumeClaim:
            claimName: benachrichtigung-service-data 