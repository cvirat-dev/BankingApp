version: '3.8'
services:

  konto-service:
    build: ./konto-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - banking-net

  benachrichtigung-service:
    build: ./benachrichtigung-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - banking-net

networks:
  banking-net:
    driver: bridge